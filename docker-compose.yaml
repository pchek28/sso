---
services:
  sso:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: Dockerfile
    container_name: sso
    # environment:
    depends_on:
      sso-postgres:
        condition: service_healthy
      sso-postgres-migrate:
        condition: service_completed_successfully
    ports:
      # только для разработки (grpcurl с компьютера); в проде убрать
      - "127.0.0.1:44044:44044"
    restart: always

  sso-postgres:
    image: postgres:18.4-bookworm
    container_name: sso-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+: монтируем /var/lib/postgresql, а не /data
      # :Z нужен при включённом SELinux (Fedora)
      - ${PROJECT_ROOT}/.out/pgdata:/var/lib/postgresql:Z
    restart: always
    healthcheck:
      # $$ передаёт переменную в контейнер, чтобы не зашивать имена в файл
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  sso-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations:ro,Z
    depends_on:
      sso-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: sso-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:sso-postgres:5432
    depends_on:
      - sso-postgres
    ports:
      # 5433 на компьютере, чтобы не конфликтовать с базой TODO_APP на 5432
      - "127.0.0.1:5433:5432"
